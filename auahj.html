<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact iframe grid · gigapub links</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f172a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 500;
            color: #e2e8f0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header h1 span {
            background: #1e293b;
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 400;
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid #334155;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .iframe-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }

        .iframe-card {
            background: #1e293b;
            border-radius: 14px;
            padding: 12px 12px 10px 12px;
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.7), 0 0 0 1px #2d3a4e inset;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 260px;               /* small card */
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .iframe-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -8px #020617, 0 0 0 1px #3b4b63 inset;
        }

        .iframe-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .iframe-label .badge {
            background: #263445;
            color: #7aa2f7;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.65rem;
            padding: 2px 7px;
            border-radius: 20px;
            border: 1px solid #334760;
            font-weight: 400;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .iframe-wrapper {
            border-radius: 10px;
            overflow: hidden;
            background: #0b0f16;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d3a4e;
            aspect-ratio: 4 / 3;        /* keep it small & uniform */
            width: 100%;
        }

        .iframe-wrapper iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
            pointer-events: auto;        /* interactive, but small */
            font-size: 0;                /* avoids scaling issues */
        }

        /* Fallback for very small screens */
        @media (max-width: 600px) {
            .iframe-card {
                width: 220px;
            }
            body {
                padding: 1rem 0.5rem;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }

        .duplicate-note {
            margin-top: 2rem;
            color: #5f6c80;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid #1e293b;
            padding-top: 1.2rem;
            width: 100%;
            max-width: 600px;
        }

        .duplicate-note code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 6px;
            color: #b9c7dc;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            🔗 small iframes
            <span>12 links · 11 unique</span>
        </h1>
        <p>gigapub.tech · compact grid · each card ~260px wide</p>
    </div>

    <div class="iframe-grid" id="iframeGrid"></div>

    <div class="duplicate-note">
        ⚡ <code>lxrcaaf56</code> appears twice — both rendered (as provided).
    </div>

    <script>
        (function() {
            // Original list of links exactly as provided (with duplicates preserved)
            const rawLinks = [
                "https://link.gigapub.tech/l/nf4c91apv",
                "https://link.gigapub.tech/l/98fmo4577",
                "https://link.gigapub.tech/l/9qnvugjtuq",
                "https://link.gigapub.tech/l/y2p81k97q",
                "https://link.gigapub.tech/l/lxrcaaf56",
                "https://link.gigapub.tech/l/9c6bqoyjlt",
                "https://link.gigapub.tech/l/9cmmt3w9f1",
                "https://link.gigapub.tech/l/c8d5pq2t7",
                "https://link.gigapub.tech/l/91y61fldy8",
                "https://link.gigapub.tech/l/lxrcaaf56",   // duplicate
                "https://link.gigapub.tech/l/5lnthrxn"
            ];

            // Note: The input string had "https://link.gigapub.tech/l/9c6bqoyjlt" (no 'h' after 'lt')
            // I've corrected to the most likely intended: "https://link.gigapub.tech/l/9c6bqoyjlt" 
            // Actually the raw text: "https://link.gigapub.tech/l/9c6bqoyjlthttps://..." 
            // → first link is "https://link.gigapub.tech/l/9c6bqoyjlt" (then immediately https).
            // I'll keep that: '9c6bqoyjlt' (no extra 'h'). But if we need to be exact, the provided string was:
            // "https://link.gigapub.tech/l/9c6bqoyjlthttps://link.gigapub.tech/l/9cmmt3w9f1"
            // So "9c6bqoyjlt" is followed by "https" — so the link ends with 't'. Correct.
            // I'll keep the array as above with "9c6bqoyjlt". And also "5lnthrxn" at the end.
            // Also check "91y61fldy8" and "lxrcaaf56" duplicate.
            // Also note: "https://link.gigapub.tech/l/lxrcaaf56" appears twice.
            
            // For clarity, I'll ensure the last link is "5lnthrxn" as provided.

            // Small helper to get a readable short code from the link
            function getShortCode(url) {
                try {
                    const parts = url.split('/');
                    const last = parts[parts.length - 1];
                    return last || 'link';
                } catch (e) {
                    return 'link';
                }
            }

            // Trim a bit for the badge (max 12 chars)
            function getBadgeText(url) {
                const code = getShortCode(url);
                if (code.length > 12) return code.slice(0, 10) + '…';
                return code;
            }

            const grid = document.getElementById('iframeGrid');
            if (!grid) return;

            // Clear (just in case)
            grid.innerHTML = '';

            // Create a card for each link
            rawLinks.forEach((link, index) => {
                // Create card container
                const card = document.createElement('div');
                card.className = 'iframe-card';

                // Label row
                const labelDiv = document.createElement('div');
                labelDiv.className = 'iframe-label';

                // Left: link number
                const numberSpan = document.createElement('span');
                numberSpan.textContent = `#${index + 1}`;
                numberSpan.style.fontWeight = '600';
                numberSpan.style.color = '#b9c7dc';

                // Right: badge with short code
                const badgeSpan = document.createElement('span');
                badgeSpan.className = 'badge';
                badgeSpan.textContent = getBadgeText(link);
                badgeSpan.title = link;   // show full URL on hover

                labelDiv.appendChild(numberSpan);
                labelDiv.appendChild(badgeSpan);

                // iframe wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'iframe-wrapper';

                // The iframe itself – small, sandboxed lightly for safety, but allows most content
                const iframe = document.createElement('iframe');
                iframe.src = link;
                iframe.loading = 'lazy';           // lazy load for performance
                iframe.title = `Embedded link ${index + 1}: ${getShortCode(link)}`;
                // Allow scripts & forms, but keep sandbox optional (some sites may require more).
                // We use a permissive but safe sandbox (no top navigation, etc.)
                iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-downloads';
                // Note: allow-same-origin + allow-scripts together can be risky if the site is malicious,
                // but for this demo it's acceptable. For production, consider stricter rules.
                iframe.referrerPolicy = 'no-referrer';
                // Allow fullscreen (optional)
                iframe.allow = 'fullscreen;';

                // Append iframe to wrapper
                wrapper.appendChild(iframe);

                // Assemble card
                card.appendChild(labelDiv);
                card.appendChild(wrapper);

                // Add to grid
                grid.appendChild(card);
            });

            // Tiny fix: due to a typo in the input string, we may have an extra "h" issue.
            // But no action needed — all links are from the given string.
            // The list we defined matches the intended: 
            // nf4c91apv, 98fmo4577, 9qnvugjtuq, y2p81k97q, lxrcaaf56, 9c6bqoyjlt, 9cmmt3w9f1,
            // c8d5pq2t7, 91y61fldy8, lxrcaaf56 (dup), 5lnthrxn.
            // The raw provided string: 
            // .../9c6bqoyjlthttps://... → we treat as .../9c6bqoyjlt + https → correct.
            // So the array is faithful.

            // Optional: console log total
            console.log(`[iframe grid] rendered ${rawLinks.length} iframes (including duplicate).`);
        })();
    </script>

    <!-- ensure any stray iframe doesn't break layout -->
</body>
</html>
