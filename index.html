<script>
  (function() {
    const SUPABASE_URL = 'https://gsckwfvlvrxbplekeqhn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzY2t3ZnZsdnJ4YnBsZWtlcWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTc1MjQsImV4cCI6MjEwMTIzMzUyNH0.Xi1EEEQLcrbNszk5Xk1RTieDb_L1ZLRoacYD7u8Slus';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentCategory = 'all';
    let searchTerm = '';
    let games = [];
    let favorites = [];
    let recent = [];
    let currentGameId = null;
    let userId = null;
    let userData = null;
    let settings = {};
    let popupLoaded = false;

    const grid = document.getElementById('gameGrid');
    const searchInput = document.getElementById('searchInput');
    const catBtns = document.querySelectorAll('.category-btn');
    const favCount = document.getElementById('favCount');
    const recentStrip = document.getElementById('recentStrip');

    const userLevel = document.getElementById('userLevel');

    function updateUserStats() {
      if (userData) {
        userXp.textContent = userData.xp || 0;
        userLevel.textContent = userData.level || 1;
      }
    }

    function updateFavCount() {
      favCount.textContent = favorites.length;

    // ============================================
    // ইউজার ম্যানেজমেন্ট
    // ============================================
    async function getOrCreateUser() {
      let anonId = localStorage.getItem('game_anon_id');
      if (!anonId) {
        anonId = crypto.randomUUID ? crypto.randomUUID() : 'anon_' + Date.now() + '_' + Math.random().toString(36);
        localStorage.setItem('game_anon_id', anonId);
      }

      const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('anonymous_id', anonId)
        .maybeSingle();

      if (error && error.code !== 'PGRST116') {
        console.error('Error fetching user:', error);
        return createNewUser(anonId);
      }

      if (data) {
        userId = data.id;
        userData = data;
        const updates = {
          last_visit: new Date().toISOString(),
          total_visits: data.total_visits + 1
        };
        await supabase.from('users').update(updates).eq('id', userId);
        favorites = data.favorites || [];
        recent = data.recently_played || [];
        updateFavCount();
        updateUserStats();
        renderRecent();
        return data;
      } else {
        return createNewUser(anonId);
      }
    }

    async function createNewUser(anonId) {
      const info = await gatherUserInfo();
      const newUser = {
        anonymous_id: anonId,
        ip_address: info.ip || null,
        country: info.country || null,
        device: info.device || null,
        browser: info.browser || null,
        os: info.os || null,
        language: info.language || null,
        first_visit: new Date().toISOString(),
        last_visit: new Date().toISOString(),
        total_visits: 1,
        favorites: [],
        recently_played: [],
        xp: 0,
        level: 1,
        achievements: [],
        play_count: 0
      };
      const { data, error } = await supabase.from('users').insert(newUser).select().single();
      if (error) {
        console.error('Error creating user:', error);
        userId = null;
        userData = null;
        favorites = [];
        recent = [];
        return null;
      }
      userId = data.id;
      userData = data;
      favorites = data.favorites || [];
      recent = data.recently_played || [];
      updateFavCount();
      updateUserStats();
      renderRecent();
      return data;
    }

    async function gatherUserInfo() {
      const info = {};
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        info.ip = data.ip;
        info.country = data.country_name;
      } catch (e) {}
      info.device = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
      info.browser = navigator.userAgent.match(/(firefox|chrome|safari|edg)/i)?.[0] || 'Unknown';
      info.os = navigator.platform || 'Unknown';
      info.language = navigator.language || 'en-US';
      return info;
    }

    async function syncUserData(updates) {
      if (!userId) return;
      const { error } = await supabase.from('users').update(updates).eq('id', userId);
      if (error) console.error('Sync error:', error);
    }

    // ============================================
    // ডাটা ফেচ
    // ============================================
    async function fetchGames() {
      const { data, error } = await supabase.from('games').select('*').order('title');
      if (error) {
        console.error('Error fetching games:', error);
        return [];
      }
      return data;
    }

    async function fetchSettings() {
      const { data, error } = await supabase.from('settings').select('*').eq('id', 1).maybeSingle();
      if (error) {
        console.error('Error fetching settings:', error);
        return {};
      }
      return data || {};
    }

    async function fetchAds() {
      const { data, error } = await supabase.from('advertisements').select('*').eq('enabled', true);
      if (error) {
        console.error('Error fetching ads:', error);
        return [];
      }
      return data;
    }

    // ============================================
    // MRMND অ্যাড ইনজেকশন (স্পেশাল)
    // ============================================
    function injectMRMNDAds() {
      // MRMND ব্যানার অ্যাড গুলো রেন্ডার করুন
      const mrmndDivs = document.querySelectorAll('[data-mndbanid]');
      mrmndDivs.forEach(div => {
        // MRMND স্ক্রিপ্ট স্বয়ংক্রিয়ভাবে এই ডিভিগুলোতে অ্যাড রেন্ডার করবে
        // শুধু নিশ্চিত করুন যে ডিভিগুলো visible আছে
        div.style.display = 'block';
      });
    }

    // ============================================
    // অ্যাড ইনজেকশন (Supabase থেকে)
    // ============================================
    function injectAds(ads) {
      // ক্লিয়ার করুন
      document.getElementById('adBannerTop').innerHTML = '';
      document.getElementById('adBannerBottom').innerHTML = '';
      document.getElementById('adNative').innerHTML = '';
      document.getElementById('adSticky').style.display = 'none';

      ads.forEach(ad => {
        if (ad.type === 'sticky') {
          const container = document.getElementById('adSticky');
          container.style.display = 'block';
          container.innerHTML = ad.code;
        } 
        else if (ad.type === 'banner') {
          const id = ad.position === 'top' ? 'adBannerTop' : 'adBannerBottom';
          document.getElementById(id).innerHTML = ad.code;
          
          // MRMND ডিসপ্লে অ্যাড ডিটেক্ট করে রেন্ডার
          if (ad.code.includes('mrmnd') || ad.code.includes('061aa906')) {
            setTimeout(() => {
              const container = document.getElementById(id);
              const scriptTags = container.querySelectorAll('script');
              scriptTags.forEach(oldScript => {
                const newScript = document.createElement('script');
                newScript.async = true;
                newScript.src = oldScript.src;
                if (oldScript.dataset) {
                  Object.keys(oldScript.dataset).forEach(key => {
                    newScript.dataset[key] = oldScript.dataset[key];
                  });
                }
                oldScript.parentNode.replaceChild(newScript, oldScript);
              });
            }, 100);
          }
        } 
        else if (ad.type === 'native') {
          document.getElementById('adNative').innerHTML = ad.code;
        } 
        else if (ad.type === 'popup') {
          if (!popupLoaded) {
            loadPopupAd(ad.code);
            popupLoaded = true;
          }
        }
      });
    }

    // পপআন্ডার অ্যাড লোডার
    function loadPopupAd(code) {
      if (document.querySelector('script[data-mndpopid]')) {
        return;
      }
      
      const scriptMatch = code.match(/<script[^>]*src=["']([^"']*)["'][^>]*data-mndpopid=["']([^"']*)["'][^>]*><\/script>/);
      if (scriptMatch) {
        const script = document.createElement('script');
        script.async = true;
        script.src = scriptMatch[1];
        script.setAttribute('data-mndpopid', scriptMatch[2]);
        document.head.appendChild(script);
        console.log('✅ Popunder ad loaded');
      }
    }

    // ============================================
    // রেন্ডার ফাংশন
    // ============================================
    function renderGrid() {
      const filtered = games.filter(game => {
        const matchCategory = currentCategory === 'all' || game.category === currentCategory;
        const matchSearch = game.title.toLowerCase().includes(searchTerm.toLowerCase());
        return matchCategory && matchSearch && game.status !== 'hidden';
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#94a3b8; padding:3rem;">No games found 🎮</div>`;
        return;
      }

      grid.innerHTML = filtered.map(game => {
        const isFav = favorites.includes(game.id);
        return `
          <div class="game-card" data-id="${game.id}">
            <div class="card-thumb">
              <img src="${game.thumbnail || 'https://placehold.co/400x250/1a1f33/7c3aed?text=No+Image'}" alt="${game.title}" loading="lazy">
              <div class="play-overlay" data-id="${game.id}">
                <i class="fas fa-play"></i>
              </div>
            </div>
            <div class="card-body">
              <div class="card-title">${game.title}</div>
              <div class="card-meta">
                <span class="card-category">${game.category || 'General'}</span>
                <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${game.id}"><i class="fas fa-heart"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.game-card').forEach(card => {
        const id = parseInt(card.dataset.id);
        card.addEventListener('click', (e) => {
          if (e.target.closest('.fav-btn')) return;
          openGame(id);
        });
        const overlay = card.querySelector('.play-overlay');
        if (overlay) overlay.addEventListener('click', (e) => { e.stopPropagation(); openGame(id); });
        const favBtn = card.querySelector('.fav-btn');
        if (favBtn) favBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(id);
        });
      });
    }

    function renderRecent() {
      if (!recent.length) { recentStrip.innerHTML = '<span style="color:#475569; font-size:0.9rem;">No games played yet</span>'; return; }
      recentStrip.innerHTML = recent.slice(0, 8).map(id => {
        const g = games.find(gg => gg.id === id);
        if (!g) return '';
        return `<div class="recent-chip" data-id="${id}"><i class="fas fa-history"></i> ${g.title}</div>`;
      }).join('');
      recentStrip.querySelectorAll('.recent-chip').forEach(chip => {
        chip.addEventListener('click', () => openGame(parseInt(chip.dataset.id)));
      });
    }

    async function toggleFavorite(id) {
      const idx = favorites.indexOf(id);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(id);
      await syncUserData({ favorites: favorites });
      updateFavCount();
      renderGrid();
      if (idx === -1) {
        await addXP(5);
      }
    }

    async function addXP(amount) {
      if (!userId) return;
      const { data, error } = await supabase.from('users').select('xp, level').eq('id', userId).single();
      if (error || !data) return;
      let newXp = data.xp + amount;
      let newLevel = data.level;
      while (newXp >= newLevel * 100) {
        newXp -= newLevel * 100;
        newLevel++;
        await addAchievement(`Reached Level ${newLevel}`);
      }
      await supabase.from('users').update({ xp: newXp, level: newLevel }).eq('id', userId);
      if (userData) {
        userData.xp = newXp;
        userData.level = newLevel;
        updateUserStats();
      }
    }

    async function addAchievement(name) {
      if (!userId) return;
      const { data } = await supabase.from('users').select('achievements').eq('id', userId).single();
      let achievements = data?.achievements || [];
      if (!achievements.includes(name)) {
        achievements.push(name);
        await supabase.from('users').update({ achievements }).eq('id', userId);
      }
    }

    async function openGame(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;
      currentGameId = id;
      
      recent = recent.filter(gid => gid !== id);
      recent.unshift(id);
      if (recent.length > 12) recent.pop();
      await syncUserData({ recently_played: recent });
      renderRecent();

      await supabase.from('games').update({ plays: (game.plays || 0) + 1 }).eq('id', id);
      await addXP(20);

      homepage.style.display = 'none';
      gamePage.classList.add('active');
      gamePageTitle.textContent = game.title;

      gameIframe.style.display = 'none';
      iframeError.classList.add('hidden');
      loadingIndicator.classList.remove('hidden');

      setTimeout(() => {
        gameIframe.src = game.url;
        gameIframe.style.display = 'block';
        loadingIndicator.classList.add('hidden');
        
        gameIframe.onerror = function() {
          loadingIndicator.classList.add('hidden');
          gameIframe.style.display = 'none';
          iframeError.classList.remove('hidden');
        };
        gameIframe.onload = function() {
          loadingIndicator.classList.add('hidden');
          gameIframe.style.display = 'block';
          iframeError.classList.add('hidden');
        };
        setTimeout(() => {
          loadingIndicator.classList.add('hidden');
          gameIframe.style.display = 'block';
        }, 4000);
      }, 300);
    }

    function goHome() {
      gamePage.classList.remove('active');
      homepage.style.display = 'block';
      gameIframe.src = '';
      iframeError.classList.add('hidden');
      loadingIndicator.classList.add('hidden');
      gameIframe.style.display = 'none';
      currentGameId = null;
    }

    function toggleFullscreen() {
      const iframe = document.getElementById('gameIframe');
      if (!document.fullscreenElement) {
        iframe.requestFullscreen?.() || iframe.webkitRequestFullscreen?.() || iframe.msRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.msExitFullscreen?.();
      }
    }

    function applySettings(settings) {
      if (settings.website_name) {
        siteTitle.innerHTML = `<i class="fas fa-gamepad" style="color:#a78bfa; margin-right: 8px;"></i>${settings.website_name}`;
        document.title = settings.website_name;
      }
      if (settings.favicon_url) {
        let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = settings.favicon_url;
        document.head.appendChild(link);
      }
      if (settings.theme_color) {
        document.body.style.backgroundColor = settings.theme_color;
      }
      if (settings.background_css) {
        document.body.style.backgroundImage = settings.background_css;
      }
      if (settings.maintenance_mode) {
        alert(settings.maintenance_message || 'Site is under maintenance.');
      }
    }

    async function init() {
      settings = await fetchSettings();
      applySettings(settings);
      await getOrCreateUser();
      games = await fetchGames();
      renderGrid();
      renderRecent();
      updateFavCount();
      updateUserStats();

      // MRMND অ্যাড ইনজেক্ট করুন (হেডারে এবং ফুটারে থাকা)
      injectMRMNDAds();

      // Supabase থেকে অ্যাড ফেচ করে ইনজেক্ট করুন
      const ads = await fetchAds();
      injectAds(ads);

      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        renderGrid();
      });

      catBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          catBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderGrid();
        });
      });

      backHomeBtn.addEventListener('click', goHome);
      fullscreenBtn.addEventListener('click', toggleFullscreen);

      const lastVisitDate = localStorage.getItem('game_last_visit_date');
      const today = new Date().toDateString();
      if (lastVisitDate !== today) {
        await addXP(30);
        localStorage.setItem('game_last_visit_date', today);
      }

      // রিয়েল-টাইম আপডেট
      supabase
        .channel('games_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'games' }, () => {
          fetchGames().then(newGames => {
            games = newGames;
            renderGrid();
          });
        })
        .subscribe();

      supabase
        .channel('ads_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'advertisements' }, () => {
          fetchAds().then(newAds => {
            injectAds(newAds);
          });
        })
        .subscribe();
    }

    init();
  })();
</script>
</body>
</html>
